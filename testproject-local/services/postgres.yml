#
# This file is included in docker-compose.yml. Docker volumes are defined there.
# Docker Compose profile: postgres.
#
version: "3.4"

x-default-policy: &default-policy
  profiles:
    - postgres
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "1"

#
# PostgreSQL (2 physical replicas, no automatic failover) + maintenance script.
#
services:
  postgres:
    image: timescale/timescaledb-ha:$POSTGRES_IMAGE_VERSION
    ports:
      - published: 5432
        target: 5432
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ../images/postgres/init/:/docker-entrypoint-initdb.d/:ro
    environment:
      # create user with replication grant
      - POSTGRES_REPLICATOR_USER
      - POSTGRES_REPLICATOR_PASSWORD
      # becomes root DB user, by design
      - POSTGRES_USER=$SQL_USER
      - POSTGRES_PASSWORD=$SQL_PASSWORD
      - POSTGRES_DB=$SQL_DATABASE
      # create more DBs for POSTGRES_USER
      - SQL_MORE_DATABASES=$SQL_VAULT_DATABASE $SQL_KEYCLOAK_DATABASE $SQL_UPTRACE_DATABASE
      # create tables according to https://developer.hashicorp.com/vault/docs/configuration/storage/postgresql
      # because Vault doesn't do that (unlike its MySQL plugin which auto-creates the tables)
      - SQL_VAULT_DATABASE
      - SQL_VAULT_TABLE
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username $SQL_USER -q || exit 1" ]
    <<: *default-policy

  # periodic VACUUM + ANALYZE + prune deleted LOBs
  postgres-maintenance:
    build:
      context: ../images/postgres-maintenance
    environment:
      - PGHOST=postgres
      - PGUSER=$SQL_USER
      - PGPASSWORD=$SQL_PASSWORD
      - PGDATABASES=$SQL_DATABASE,$SQL_VAULT_DATABASE,$SQL_KEYCLOAK_DATABASE,$SQL_UPTRACE_DATABASE
      - PGJOBS=1
    <<: *default-policy
